<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#g2)"/>
  <!-- Radio tower / antenna -->
  <g fill="none" stroke="#e0e7ff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tower body -->
    <line x1="64" y1="38" x2="64" y2="100" stroke-width="5"/>
    <!-- Tower base legs -->
    <line x1="64" y1="100" x2="48" y2="108" stroke-width="4"/>
    <line x1="64" y1="100" x2="80" y2="108" stroke-width="4"/>
    <!-- Tower crossbars -->
    <line x1="58" y1="62" x2="70" y2="62" stroke-width="3"/>
    <line x1="56" y1="76" x2="72" y2="76" stroke-width="3"/>
    <!-- Signal waves — left -->
    <path d="M42 46a18 18 0 0 1 0-20" stroke-width="3.5" stroke="url(#g1)"/>
    <path d="M32 50a30 30 0 0 1 0-32" stroke-width="3" stroke="url(#g1)" opacity="0.7"/>
    <path d="M22 54a42 42 0 0 1 0-42" stroke-width="2.5" stroke="url(#g1)" opacity="0.4"/>
    <!-- Signal waves — right -->
    <path d="M86 46a18 18 0 0 0 0-20" stroke-width="3.5" stroke="url(#g1)"/>
    <path d="M96 50a30 30 0 0 0 0-32" stroke-width="3" stroke="url(#g1)" opacity="0.7"/>
    <path d="M106 54a42 42 0 0 0 0-42" stroke-width="2.5" stroke="url(#g1)" opacity="0.4"/>
  </g>
  <!-- Antenna tip dot -->
  <circle cx="64" cy="34" r="4" fill="#e0e7ff"/>
</svg>
